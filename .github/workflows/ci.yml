name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-overlay.txt

      - name: Install JavaScript packages
        run: npm ci

      - name: Install Python packages
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt -r requirements-overlay.txt

      - name: JavaScript unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Python tests
        run: PYTHONPATH=. .venv/bin/python -m pytest -q tests

      # Its own process: importing download_eic first trips an intended
      # extractor-independence assertion (see AGENTS.md).
      - name: Color-scale tests
        run: PYTHONPATH=. .venv/bin/python -m pytest -q color_scales/tests

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test (built dist)
        run: |
          npx vite preview --host 127.0.0.1 --port 8001 --strictPort &
          PREVIEW=$!
          for i in $(seq 60); do curl -fs http://127.0.0.1:8001/ >/dev/null && break; sleep 1; done
          JUKEBOX_URL=http://127.0.0.1:8001 npm run test:browser
          kill "$PREVIEW"
